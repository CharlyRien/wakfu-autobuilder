kotlin.code.style=official

# Explicit heaps: the defaults (512 MB) run the Kotlin compiler out of memory on the large autobuilder test sources
# (OutOfMemoryError / GC overhead limit exceeded in :autobuilder:compileTestKotlin, CI and local).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
