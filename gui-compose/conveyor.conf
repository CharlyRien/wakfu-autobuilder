// Conveyor packaging for the Compose Desktop front-end.
// Pulls the JVM, main class and runtime classpath straight from Gradle (Compose Desktop aware).
include "#!../gradlew -q printConveyorConfig"

// TEMPORARY: bundle Azul Zulu instead of the Gradle plugin's Oracle OpenJDK. Since 2026-10-06 Foojay's disco API no longer
// lists Oracle OpenJDK / Temurin / Corretto JDK 25 builds (https://github.com/foojayio/discoapi/issues/165), and
// Conveyor resolves its "Linker JDK" through Foojay, so the deploy fails ("Could not locate an OpenJDK for Java 25").
// Zulu is still listed. The stdlib JDK snippets APPEND to the inputs, so clear the OpenJDK ones before including
// Zulu. Remove this block (back to the plugin's default) once Foojay lists OpenJDK 25 again.
app.jvm.linux.aarch64.glibc.inputs = []
app.jvm.linux.amd64.glibc.inputs = []
app.jvm.mac.aarch64.inputs = []
app.jvm.mac.amd64.inputs = []
app.jvm.windows.amd64.inputs = []
internal.conveyor.jdk-imports = []
include required("/stdlib/jdk/25/azul.conf")

gradle.project-name = wakfu-autobuilder

app {
    display-name = Wakfu-Autobuilder
    fsname = wakfu-autobuilder
    vcs-url = "https://github.com/CharlyRien/wakfu-autobuilder"
    icons = "src/main/resources/assets/branding/app-icon.png"

    // Native installers for all three desktop OSes from a single JVM build.
    // Unsigned builds (no paid certificate): users bypass the OS gatekeeper on first launch.

    // Download site + auto-update feed. The deploy workflow (.github/workflows/deploy.yml, manual
    // workflow_dispatch) runs Conveyor against this file: packages + the Sparkle/MSIX/apt update
    // metadata are uploaded to GitHub Releases, and the download page is published to the gh-pages branch.
    site {
        theme = dark
        github {
            oauth-token = ${env.OAUTH_TOKEN}
            pages-branch = "gh-pages"
        }
    }

    mac.info-plist.LSMinimumSystemVersion = 11.0.0

    // The serial exact-pass certificate DP (the async "Proven optimal" badge) peaks at ~1 GB of heap at
    // level 245. The JVM default max heap (25% of RAM) suffices on 8 GB+ machines but is tight on 4 GB ones —
    // there the badge computation OOMs and degrades to "unavailable" (caught; no crash). An explicit floor
    // with headroom lets the badge work everywhere. -Xmx only caps; the JVM commits lazily, so this is safe on
    // small machines too.
    jvm.options += "-Xmx3g"
}

conveyor.compatibility-level = 21
