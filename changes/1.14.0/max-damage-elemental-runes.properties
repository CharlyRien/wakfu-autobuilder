type=fix
en=Max Damage: elemental runes no longer count as secondary masteries, which kept Neutrality and the other sublimations that cap secondary masteries out of rune builds; the "Optimal proven" badge could be wrong
fr=Dégâts max : les runes élémentaires ne comptent plus comme des maîtrises secondaires, ce qui écartait Neutralité et les autres sublimations limitant les maîtrises secondaires des builds avec runes ; le badge « Optimal prouvé » pouvait être faux
