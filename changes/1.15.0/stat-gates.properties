type=fix
en=Items with a stat condition, such as range ≤ 3, are only used when the build meets it, as in the game. Saved builds that break one show a warning.
fr=Les objets à condition de caractéristique, comme portée ≤ 3, ne sont utilisés que si le build la respecte, comme en jeu. Les builds enregistrés qui en enfreignent une affichent un avertissement.
