type=fix
en=Builds no longer combine an epic item with the two common items the game counts as epic (Ancient Trool Warrior Spikes, Old Sanefty Belt): only one of them can be worn at a time
fr=Les builds ne combinent plus un objet épique avec les deux objets communs que le jeu compte comme épiques (Piquants du Guerrier Trool anciens, Sain Turastil ancienne) : un seul d'entre eux peut être porté à la fois
