type=fix
en=Neutrality, Ambition, Inflexibility and Pretension now require each secondary mastery to be zero or below, as in the game: a positive mastery can no longer be offset by a negative one, which credited bonuses the game never grants
fr=Neutralité, Ambition, Inflexibilité et Prétention exigent désormais que chaque maîtrise secondaire soit nulle ou négative, comme en jeu : une maîtrise positive ne peut plus être compensée par une négative, ce qui accordait des bonus que le jeu ne donne pas
