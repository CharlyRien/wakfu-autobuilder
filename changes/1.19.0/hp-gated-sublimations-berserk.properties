type=fix
en=Carnage and Vital Influence no longer count in a berserk damage scenario: they need high HP, so a berserk build no longer gets their mastery and critical hit.
fr=Carnage et Influence vitale ne comptent plus dans un scénario de dégâts berserk : elles exigent des PV élevés, un build berserk ne reçoit donc plus leur maîtrise ni leur coup critique.
