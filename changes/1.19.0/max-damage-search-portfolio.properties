type=perf
en=Max damage: on machines giving the search 3 workers (Maximum on 4 threads, Balanced on 8), a search finds a better build in the same time, up to about 15% more damage at level 245. Builds saved earlier are flagged as worth re-running
fr=Dégâts max : sur les machines qui donnent 3 workers à la recherche (Maximum sur 4 threads, Équilibré sur 8), une recherche trouve un meilleur build dans le même temps, jusqu’à environ 15 % de dégâts en plus au niveau 245. Les builds déjà enregistrés sont signalés comme à relancer
