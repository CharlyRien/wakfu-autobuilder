type=fix
en=Items with equip conditions are now respected: the nation swords come with their ring, class emblems and amulets go to their class only, and rings that exclude each other are never combined
fr=Les objets à condition d'équipement sont désormais respectés : les épées de nation viennent avec leur anneau, les emblèmes et amulettes de classe vont à leur classe seulement, et les anneaux qui s'excluent ne sont plus combinés
