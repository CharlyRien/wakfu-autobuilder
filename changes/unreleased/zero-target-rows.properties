type=fix
en=A target set to 0 (a resistance, dodge…) now means "never negative" in every mode, and no longer turns a request on one element into one on several elements (which removed its optimality badge)
fr=Une cible à 0 (une résistance, l'esquive…) signifie désormais « jamais négatif » dans tous les modes, et ne transforme plus une recherche sur un seul élément en recherche sur plusieurs éléments (ce qui lui retirait son badge d'optimalité)
