type=fix
en=Max damage: a build may now mix rune types on one item, for example a single HP rune to reach an HP target, or a few secondary-mastery runes under a Neutralité-type sublimation or an item's stat condition (such as a distance mastery limit), so an "Optimal proven" badge can no longer miss a better build
fr=Dégâts max : un build peut désormais mélanger plusieurs types de runes sur un même objet, par exemple une seule rune de PV pour atteindre une cible de PV, ou quelques runes de maîtrise secondaire sous une sublimation de type Neutralité ou sous la condition de caractéristique d'un objet (comme une limite de maîtrise distance), donc un badge « Optimal prouvé » ne peut plus manquer un meilleur build
