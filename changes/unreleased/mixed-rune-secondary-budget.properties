type=fix
en=Max damage: a build may now mix rune types on one item, such as one HP rune to reach an HP target, or a few secondary-mastery runes under a Neutralité-type sublimation or an item's stat condition, so an "Optimal proven" badge no longer misses a better build
fr=Dégâts max : un build peut mélanger des types de runes sur un objet, comme une rune de PV pour atteindre une cible de PV, ou des runes de maîtrise secondaire sous une Neutralité ou la condition de caractéristique d'un objet ; « Optimal prouvé » ne manque plus un meilleur build
