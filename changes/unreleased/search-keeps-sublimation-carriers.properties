type=fix
en=Searches no longer miss the best build when it needs an epic or relic item just to carry its sublimation, a higher-level item for its better runes, or a ring hidden by two versions of a better ring, a miss that could even show "Optimal proven"
fr=Les recherches ne ratent plus le meilleur build quand il lui faut un objet épique ou relique juste pour sa sublimation, un objet de plus haut niveau pour ses runes ou un anneau masqué par deux versions d'un meilleur anneau, un raté qui pouvait même afficher « Optimal prouvé »
