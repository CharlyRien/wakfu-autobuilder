type=perf
en=Max damage: the optimality check does up to several times less work. On a 4-core machine, the "at most X% below the optimum" badge of a level-200 or level-245 search is now ready when the search ends, instead of up to 10 seconds later
fr=Dégâts max : la vérification d’optimalité fait jusqu’à plusieurs fois moins de calculs. Sur une machine à 4 cœurs, le badge « au plus X % sous l’optimum » d’une recherche de niveau 200 ou 245 est maintenant prêt à la fin de la recherche, au lieu de jusqu’à 10 secondes plus tard
