type=perf
en=Max damage: the optimality check after a search is several times faster on high-level requests. A level-245 build on a 4-core laptop gets its "at most X% below the optimum" or "Optimal proven" badge again, usually within seconds of the search ending, instead of running out of time
fr=Dégâts max : la vérification d’optimalité après une recherche est plusieurs fois plus rapide sur les requêtes de haut niveau. Un build niveau 245 sur un portable 4 cœurs retrouve son badge « au plus X % sous l’optimum » ou « Optimal prouvé », en général quelques secondes après la fin de la recherche, au lieu de manquer de temps
