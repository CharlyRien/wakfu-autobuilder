type=perf
en=Max damage: the optimality check after a search is much faster on high-level requests (about 4× on a level-245 build on a 4-core laptop), so the "proven within X%" or "Optimal proven" badge shows up again within a minute or two instead of timing out
fr=Dégâts max : la vérification d’optimalité après une recherche est bien plus rapide sur les requêtes de haut niveau (environ 4× sur un build niveau 245 avec un portable 4 cœurs), donc le badge « prouvé à X % près » ou « Optimal prouvé » s’affiche de nouveau en une minute ou deux au lieu d’expirer
