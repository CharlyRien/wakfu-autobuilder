name: Deploy
on: [ workflow_dispatch, workflow_call ]
jobs:
    build:
        # Reuse the Build workflow (./gradlew test) as a gate.
        uses: ./.github/workflows/build.yml
    deploy:
        needs: [ build ]
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v7.0.1

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: Create Jars
                run: ./gradlew jar

            # Single-host cross-build: the per-machine Compose/OR-Tools deps in gui-compose/build.gradle.kts
            # make Conveyor package each OS with its own Skiko + native (needs Compose >= 1.11 / Skiko
            # >= 0.144 so the JVM Skiko variant resolves unambiguously — SKIKO-1013).
            # Pinned to v22.1 (Conveyor 22.1): v22.3 runs Conveyor 22.2, whose "Linker JDK" step resolves the build host's
            # JDK through a live Foojay query that can come back empty, then fails ("Could not locate an OpenJDK for
            # Java 25") — 1.15.0 and 1.17.0 deploys failed that way. Unpin once Hydraulic fixes it.
            -   name: Run Conveyor
                uses: hydraulic-software/conveyor/actions/build@v22.1
                env:
                    OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                with:
                    extra_flags: '-f ./gui-compose/conveyor.conf'
                    command: make copied-site
                    signing_key: ${{ secrets.SIGNING_KEY }}
                    agree_to_license: 1
