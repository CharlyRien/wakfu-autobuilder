name: Build

on:
    push:
    workflow_dispatch:
    workflow_call:
    schedule:
        # Nightly run of the heavy full-pool OR-Tools OPTIMAL proof tests (@Tag("slow")). They are excluded
        # from the per-push `test` task so every push/PR stays fast; 03:17 UTC keeps them off the critical path.
        -   cron: '17 3 * * *'

jobs:
    test-shards:
        runs-on: ubuntu-latest
        strategy:
            # Finish every shard even if another fails, preserving all test results.
            fail-fast: false
            matrix:
                shard: [most-masteries, solver, floors-soft, medium, remaining]
        steps:
            -   name: Checkout project sources
                uses: actions/checkout@v7.0.1

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: Run the assigned tests
                env:
                    SHARD: ${{ matrix.shard }}
                run: |
                    if [ "$SHARD" = remaining ]; then
                        ./gradlew test -PciTestShard="$SHARD"
                    else
                        ./gradlew :autobuilder:test -PciTestShard="$SHARD"
                    fi

    build:
        # One gate for pushes and reusable deploy calls. always() prevents a failed/cancelled
        # shard from turning this gate into a skipped (and potentially green) check.
        needs: [test-shards]
        if: always()
        runs-on: ubuntu-latest
        steps:
            -   name: Require every test shard to pass
                env:
                    SHARD_RESULT: ${{ needs.test-shards.result }}
                run: test "$SHARD_RESULT" = success

    release-note-scripts:
        # Scenario tests of the release-note tooling (filing on the release PR, the PR gate, the commit-msg hook) on
        # throwaway local repositories: seconds, no Gradle.
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout project sources
                uses: actions/checkout@v7.0.1

            -   name: Test the release-note scripts
                run: scripts/changesets/test-changesets.sh

    slow-tests:
        # The heavy full-pool OR-Tools proof tests burn large deterministic-time budgets (the two bare
        # free-solve proofs run the 1-worker deterministic protocol; the runes+subs guards run a short
        # search plus the certificate), so on a 2-core runner the nightly takes a while. Run them nightly +
        # on demand only, never on per-push CI. The det budgets are CAPS — a green proof returns as soon as
        # OPTIMAL lands — so the timeout below is a hang/regression backstop, not the expected runtime.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 240 # the pre-existing catalog no-bail proof alone runs ~1 h; the rest ~30 min
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout project sources
                uses: actions/checkout@v7.0.1

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v6

            -   name: Run the heavy full-pool proof tests
                run: ./gradlew :autobuilder:slowTest

            # The console only names a failed test and its first frame in the test class (often the `runBlocking`
            # line), and prints nothing for a passing one: the JUnit XML carries each failure's message and stack,
            # each test's stdout / stderr and its duration. Uploaded even when a test failed or timed out.
            -   name: Upload the slow-test results
                if: always()
                uses: actions/upload-artifact@v7.0.1
                with:
                    name: slow-test-results
                    path: |
                        autobuilder/build/test-results/slowTest
                        autobuilder/build/reports/tests/slowTest
